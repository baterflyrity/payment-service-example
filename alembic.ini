# Alembic configuration for PaymentServiceExample.

[alembic]
# Directory containing migration scripts.
script_location = %(here)s/alembic

# Add the application source directory to Python's import path.
prepend_sys_path = %(here)s/src

# Use the platform-specific path separator (Windows/Linux).
path_separator = os

# Database URL is configured in payment_service.config.Settings
# and loaded by alembic/env.py.
# No credentials are stored in this file.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers = console
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
