[project]
name = "paymentserviceexample"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"alembic>=1.20.0",
	"asyncpg>=0.32.0",
	"fastapi>=0.143.0",
	"faststream[rabbit,cli]>=0.7.7",
	"httpx>=0.28.1",
	"pydantic>=2.14.0",
	"pydantic-settings>=2.15.0",
	"sqlalchemy[asyncio]>=2.1.4",
	"uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
	"pytest>=9.1.1",
	"pytest-asyncio>=1.4.0",
	"pytest-cov>=7.1.0",
	"ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 999
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
